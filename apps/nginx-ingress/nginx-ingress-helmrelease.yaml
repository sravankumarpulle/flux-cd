apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: nginx-ingress
spec:
  interval: 1m
  releaseName: ingress-nginx
  chart:
    spec:
      chart: ingress-nginx
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      version: "4.10.0"  # Check for latest: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  values:
    controller:
      replicaCount: 2
      service:
        type: LoadBalancer
