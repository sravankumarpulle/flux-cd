apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: nginx
  namespace: nginx-local-env
spec:
  interval: 1m
  releaseName: nginx
  chart:
    spec:
      chart: nginx
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      version: "17.0.2" # Check https://artifacthub.io/packages/helm/bitnami/nginx for latest
  values:
    service:
      type: LoadBalancer
